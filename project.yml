# Ersatzweg, falls sich Babel.xcodeproj nicht öffnen lässt:
#   brew install xcodegen && xcodegen generate
name: Babel
options:
  bundleIdPrefix: de.babelreader
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  # Englisch als zweite Sprache (String Catalog Babel/Localizable.xcstrings).
  knownRegions: [de, en, Base]
# Version und Build gelten für App und Erweiterung – sie müssen übereinstimmen.
settings:
  base:
    MARKETING_VERSION: "0.35.0"
    CURRENT_PROJECT_VERSION: "90"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
targets:
  Babel:
    type: application
    platform: iOS
    sources:
      - path: Babel
    dependencies:
      - package: SwiftSoup
      - target: BabelShare
    scheme:
      testTargets:
        - BabelTests
    # iCloud: Bibliothek über CloudKit (SwiftData), Einstellungen über den Schlüsselspeicher.
    # aps-environment für die stillen Pushes von CloudKit (Hintergrundmodus remote-notification in Support/Info.plist).
    entitlements:
      path: Babel/Babel.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.de.babelreader.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Gemeinsamer Ordner mit der Teilen-Erweiterung („In Babel öffnen“).
        com.apple.security.application-groups:
          - group.de.babelreader.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.babelreader.app
        DEVELOPMENT_TEAM: 6Y9DZT5MQZ
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Babel
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Babel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone nur aufrecht. Auf dem iPad verlangt iOS alle Richtungen (sonst Warnung, Vollbild-Pflicht).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Parser, ZIP/EPUB und Lesestelle – läuft ohne Netz: xcodebuild test -scheme Babel …
  BabelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BabelTests
    dependencies:
      - target: Babel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 6Y9DZT5MQZ
  # Teilen-Menü: „In Babel öffnen“ für Links und EPUB-Dateien. Legt nur ab, die App importiert (Services/ShareInbox.swift).
  BabelShare:
    type: app-extension
    platform: iOS
    sources:
      - path: BabelShare
      - path: Babel/Services/ShareInbox.swift
    entitlements:
      path: BabelShare/BabelShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.babelreader.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.babelreader.app.share
        DEVELOPMENT_TEAM: 6Y9DZT5MQZ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: BabelShare/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BABEL_SHARE_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
